# Boiler address
boiler.ip=
# Boiler target temperature
boiler.target.temp=42
# Boiler operating times
boiler.times=10:00-17:00
# Boiler disinfect
boiler.disinfect=false
# Use boiler e-heat
boiler.eheat=false
# Backend URL
default.backed.url=
# Electricity distribution fee (CZK/MWh) without VAT
electricity.price.distribution-fee=1000.0
# Electricity sell fee (CZK/MWh) without VAT
electricity.price.sell-fee=450.0
# VAT
electricity.price.vat=21
# Futura recuperation IP address
futura.ipAddress=
# USB port with connected rs485 to HVAC
hvac.port=/dev/ttyUSB_FT232R
# Solax Inverter IP
inverter.ip=
# How much battery in % should be reserved for high tariff time
inverter.manager.high.tariff.battery.reserve=10
# Time ranges of high tariff electricity
inverter.manager.high.tariff.times=6:55-8:05;17:55-19:05
# Minimal battery state of change in %
inverter.manager.minimal.soc=20
# Whether to turn the inverter off when buy price is negative
inverter.manager.turnoff.on.negative.price=false
# Whether to switch BatteryMode to FeedInPriority in the time ranges below (outside the ranges: SelfUse)
inverter.manager.export.priority.timer.enabled=false
# Time ranges (same format as high.tariff.times) when BatteryMode = FeedInPriority; outside = SelfUse
inverter.manager.export.priority.times=
# Whether to force-discharge the battery to the grid during the highest-price segments of the day
inverter.manager.force.discharge=false
# Minimal net sell price (CZK/kWh, = price - distribution fee - sell fee, incl. VAT) actually earned to consider a segment worth force-discharging into
inverter.manager.force.discharge.minimal.price=13.0
# Battery is force-discharged only down to this state of charge in %
inverter.manager.force.discharge.minimal.soc=25
# IP address of MPD
mpd.radio.ip=192.168.68.150
# Radio audio stream for MDP
mpd.radio.stream.url=https://rozhlas.stream/radiozurnal_mp3_128.mp3
# Robonect host bane
robonect.host=
# Robonect username
robonect.username=
# Robonect password
robonect.password=
# Application configuration selection
system.application.configuration.name=chuma
# Name of serial port to bridge node
system.bridge.port=/dev/ttyUSB_CH340
# Home altitude in meters
location.altitude=358
# Home location latitude
location.latitude=49.0781636
# Home location longitude
location.longitude=18.0231517